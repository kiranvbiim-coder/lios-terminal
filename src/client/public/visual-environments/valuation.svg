<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="LiOS valuation visual environment">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="76%">
      <stop offset="0" stop-color="#0A0A0D"/>
      <stop offset=".46" stop-color="#060608"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="0%" cy="45%" r="78%">
      <stop offset="0" stop-color="#F29E18" stop-opacity=".18"/><stop offset=".58" stop-color="#F29E18" stop-opacity=".035"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="100%" cy="42%" r="76%">
      <stop offset="0" stop-color="#8A63F8" stop-opacity=".18"/><stop offset=".58" stop-color="#8A63F8" stop-opacity=".035"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#F29E18" stop-opacity=".08"/><stop offset=".48" stop-color="#F29E18" stop-opacity=".72"/><stop offset="1" stop-color="#F29E18" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="cool" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#8A63F8" stop-opacity=".08"/><stop offset=".5" stop-color="#8A63F8" stop-opacity=".66"/><stop offset="1" stop-color="#8A63F8" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F29E18" stop-opacity=".22"/><stop offset=".52" stop-color="#8A63F8" stop-opacity=".28"/><stop offset="1" stop-color="#F29E18" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="softArea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F29E18" stop-opacity=".28"/><stop offset="1" stop-color="#8A63F8" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="76" height="76" patternUnits="userSpaceOnUse">
      <path d="M76 0H0V76" fill="none" stroke="#AAB1C8" stroke-opacity=".055" stroke-width=".8"/>
    </pattern>
    <filter id="blur72"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="blur28"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
    <mask id="edgeMask">
      <rect width="1920" height="1080" fill="white"/>
      <rect x="430" y="120" width="1060" height="820" rx="210" fill="#2A2A2A"/>
    </mask>
    <radialGradient id="centerQuiet" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#050506" stop-opacity=".70"/><stop offset=".62" stop-color="#050506" stop-opacity=".28"/><stop offset="1" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#leftGlow)"/>
  <rect width="1920" height="1080" fill="url(#rightGlow)"/>
  <ellipse cx="222" cy="238" rx="260" ry="220" fill="#F29E18" fill-opacity=".06" filter="url(#blur72)"/>
  <ellipse cx="1698" cy="760" rx="310" ry="250" fill="#8A63F8" fill-opacity=".055" filter="url(#blur72)"/>
  <g mask="url(#edgeMask)">
    <rect width="1920" height="1080" fill="url(#grid)" opacity=".60"/>
    
      <g fill="none" opacity=".42">
        <path d="M80 846 C302 760 390 526 612 462 C826 400 1040 494 1268 342 C1452 220 1676 186 1872 150" stroke="url(#warm)" stroke-width="2.2"/>
        <path d="M88 904 C334 808 458 614 654 564 C856 514 1030 564 1262 432 C1480 310 1686 292 1860 274" stroke="url(#cool)" stroke-width="1.6"/>
        <path d="M110 952 C342 886 500 700 698 660 C910 616 1068 652 1270 548 C1462 448 1644 424 1838 410" stroke="#8A63F8" stroke-opacity=".18"/>
      </g>
      <g opacity=".26" fill="none" stroke="url(#edge)">
        <path d="M100 824 L100 270 L330 270"/><path d="M1820 824 L1820 270 L1590 270"/>
        <path d="M170 744 C302 650 338 546 430 460"/><path d="M1750 744 C1618 650 1582 546 1490 460"/>
      </g>
      <g opacity=".22">
        <path d="M74 914 L398 598 L560 648 L322 948 Z" fill="url(#cool)"/>
        <path d="M1846 914 L1522 598 L1360 648 L1598 948 Z" fill="url(#warm)"/>
      </g>
    
  </g>
  <path d="M0 974 C310 884 504 948 714 892 C920 836 1120 878 1332 826 C1538 776 1722 802 1920 742" fill="none" stroke="url(#edge)" stroke-width="1" opacity=".18"/>
  <rect x="418" y="108" width="1084" height="844" rx="220" fill="url(#centerQuiet)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".24"/>
  <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#FFFFFF" stroke-opacity=".018"/>
</svg>