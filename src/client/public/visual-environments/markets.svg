<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="LiOS markets visual environment">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="76%">
      <stop offset="0" stop-color="#0A0A0D"/>
      <stop offset=".46" stop-color="#060608"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="0%" cy="45%" r="78%">
      <stop offset="0" stop-color="#F2A11A" stop-opacity=".18"/><stop offset=".58" stop-color="#F2A11A" stop-opacity=".035"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="100%" cy="42%" r="76%">
      <stop offset="0" stop-color="#2FA7D8" stop-opacity=".18"/><stop offset=".58" stop-color="#2FA7D8" stop-opacity=".035"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#F2A11A" stop-opacity=".08"/><stop offset=".48" stop-color="#F2A11A" stop-opacity=".72"/><stop offset="1" stop-color="#F2A11A" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="cool" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#2FA7D8" stop-opacity=".08"/><stop offset=".5" stop-color="#2FA7D8" stop-opacity=".66"/><stop offset="1" stop-color="#2FA7D8" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F2A11A" stop-opacity=".22"/><stop offset=".52" stop-color="#2FA7D8" stop-opacity=".28"/><stop offset="1" stop-color="#F2A11A" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="softArea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F2A11A" stop-opacity=".28"/><stop offset="1" stop-color="#2FA7D8" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="76" height="76" patternUnits="userSpaceOnUse">
      <path d="M76 0H0V76" fill="none" stroke="#AAB1C8" stroke-opacity=".055" stroke-width=".8"/>
    </pattern>
    <filter id="blur72"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="blur28"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
    <mask id="edgeMask">
      <rect width="1920" height="1080" fill="white"/>
      <rect x="430" y="120" width="1060" height="820" rx="210" fill="#2A2A2A"/>
    </mask>
    <radialGradient id="centerQuiet" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#050506" stop-opacity=".70"/><stop offset=".62" stop-color="#050506" stop-opacity=".28"/><stop offset="1" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#leftGlow)"/>
  <rect width="1920" height="1080" fill="url(#rightGlow)"/>
  <ellipse cx="222" cy="238" rx="260" ry="220" fill="#F2A11A" fill-opacity=".06" filter="url(#blur72)"/>
  <ellipse cx="1698" cy="760" rx="310" ry="250" fill="#2FA7D8" fill-opacity=".055" filter="url(#blur72)"/>
  <g mask="url(#edgeMask)">
    <rect width="1920" height="1080" fill="url(#grid)" opacity=".60"/>
    
      <g fill="none" opacity=".46">
        <path d="M-80 770 C250 542 368 744 650 556 S1090 384 2000 566" stroke="url(#warm)" stroke-width="2.4"/>
        <path d="M-100 824 C238 612 420 798 700 624 S1110 458 1980 632" stroke="url(#cool)" stroke-width="1.8"/>
        <path d="M-120 690 C210 470 414 668 676 488 S1098 318 1980 500" stroke="#2FA7D8" stroke-opacity=".18"/>
        <path d="M-100 596 C244 392 452 586 714 424 S1114 258 1995 410" stroke="#F2A11A" stroke-opacity=".14"/>
      </g>
      <g opacity=".26" fill="none" stroke="url(#edge)">
        <path d="M0 226 C260 174 480 298 740 216 S1250 168 1920 248"/>
        <path d="M0 298 C260 246 480 360 740 292 S1250 232 1920 316"/>
        <path d="M0 370 C260 320 480 424 740 366 S1250 298 1920 384"/>
      </g>
      <path d="M70 874 C348 802 455 582 688 620 C913 656 1092 744 1380 536 C1554 412 1714 382 1870 326" fill="none" stroke="url(#warm)" stroke-width="2.5" opacity=".50"/>
    
  </g>
  <path d="M0 974 C310 884 504 948 714 892 C920 836 1120 878 1332 826 C1538 776 1722 802 1920 742" fill="none" stroke="url(#edge)" stroke-width="1" opacity=".18"/>
  <rect x="418" y="108" width="1084" height="844" rx="220" fill="url(#centerQuiet)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".24"/>
  <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#FFFFFF" stroke-opacity=".018"/>
</svg>