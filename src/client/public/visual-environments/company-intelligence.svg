<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="LiOS company intelligence visual environment">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="76%">
      <stop offset="0" stop-color="#0A0A0D"/>
      <stop offset=".46" stop-color="#060608"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="0%" cy="45%" r="78%">
      <stop offset="0" stop-color="#F0A018" stop-opacity=".18"/><stop offset=".58" stop-color="#F0A018" stop-opacity=".035"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="100%" cy="42%" r="76%">
      <stop offset="0" stop-color="#7B64F7" stop-opacity=".18"/><stop offset=".58" stop-color="#7B64F7" stop-opacity=".035"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#F0A018" stop-opacity=".08"/><stop offset=".48" stop-color="#F0A018" stop-opacity=".72"/><stop offset="1" stop-color="#F0A018" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="cool" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#7B64F7" stop-opacity=".08"/><stop offset=".5" stop-color="#7B64F7" stop-opacity=".66"/><stop offset="1" stop-color="#7B64F7" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0A018" stop-opacity=".22"/><stop offset=".52" stop-color="#7B64F7" stop-opacity=".28"/><stop offset="1" stop-color="#F0A018" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="softArea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F0A018" stop-opacity=".28"/><stop offset="1" stop-color="#7B64F7" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="76" height="76" patternUnits="userSpaceOnUse">
      <path d="M76 0H0V76" fill="none" stroke="#AAB1C8" stroke-opacity=".055" stroke-width=".8"/>
    </pattern>
    <filter id="blur72"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="blur28"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
    <mask id="edgeMask">
      <rect width="1920" height="1080" fill="white"/>
      <rect x="430" y="120" width="1060" height="820" rx="210" fill="#2A2A2A"/>
    </mask>
    <radialGradient id="centerQuiet" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#050506" stop-opacity=".70"/><stop offset=".62" stop-color="#050506" stop-opacity=".28"/><stop offset="1" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#leftGlow)"/>
  <rect width="1920" height="1080" fill="url(#rightGlow)"/>
  <ellipse cx="222" cy="238" rx="260" ry="220" fill="#F0A018" fill-opacity=".06" filter="url(#blur72)"/>
  <ellipse cx="1698" cy="760" rx="310" ry="250" fill="#7B64F7" fill-opacity=".055" filter="url(#blur72)"/>
  <g mask="url(#edgeMask)">
    <rect width="1920" height="1080" fill="url(#grid)" opacity=".60"/>
    
      <g opacity=".50" fill="none" stroke="url(#edge)">
        <path d="M80 938 V248 L318 136 L318 782 Z" stroke-width="1.3"/>
        <path d="M368 930 V156 L618 226 V820 Z" stroke-width="1"/>
        <path d="M1840 938 V210 L1606 126 L1606 790 Z" stroke-width="1.3"/>
        <path d="M1558 930 V178 L1322 244 V824 Z" stroke-width="1"/>
      </g>
      <g opacity=".34" stroke="url(#warm)" fill="#0C0C10" fill-opacity=".35">
        <rect x="112" y="276" width="168" height="116" rx="14"/><rect x="116" y="446" width="166" height="184" rx="14"/>
        <rect x="1634" y="300" width="164" height="144" rx="14"/><rect x="1634" y="500" width="164" height="176" rx="14"/>
      </g>
      <path d="M52 768 C268 712 352 544 520 575 S746 704 842 630" fill="none" stroke="url(#warm)" stroke-width="2" opacity=".48"/>
      <path d="M1868 758 C1668 710 1560 535 1406 566 S1202 696 1080 618" fill="none" stroke="url(#cool)" stroke-width="1.6" opacity=".42"/>
    
  </g>
  <path d="M0 974 C310 884 504 948 714 892 C920 836 1120 878 1332 826 C1538 776 1722 802 1920 742" fill="none" stroke="url(#edge)" stroke-width="1" opacity=".18"/>
  <rect x="418" y="108" width="1084" height="844" rx="220" fill="url(#centerQuiet)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".24"/>
  <rect x="0" y="0" width="1920" height="1080" fill="none" stroke="#FFFFFF" stroke-opacity=".018"/>
</svg>