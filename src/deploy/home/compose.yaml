name: lios-user-home
services:
  home:
    image: ${LIOS_HOME_IMAGE:-lios-home:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "10000"
      LIOS_DATA_ROOT: /data/lios
      LIOS_EXECUTION_ISOLATION: strict
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/pycache
    ports:
      - "127.0.0.1:${LIOS_HOME_PORT:-10000}:10000"
    volumes:
      - home-data:/data/lios
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
volumes:
  home-data:
