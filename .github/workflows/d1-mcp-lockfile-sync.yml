# One-time, backend-only D1 npm lockfile reconciliation.
# This workflow is removed after package-lock.json is committed.
name: D1 MCP Lockfile Sync
on:
  push:
    branches:
      - integration/gm-mcp-v2-client-20261023
    paths:
      - src/package.json
      - .github/workflows/d1-mcp-lockfile-sync.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconcile committed npm dependency graph
        working-directory: src
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit exact lockfile to this isolated integration branch
        shell: bash
        run: |
          git diff --check
          git add src/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency graph already matches."
          else
            git -c user.name='LiOS dependency bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "deps(GM20): lock official MCP v2 client and its dependency graph"
            git push origin HEAD:integration/gm-mcp-v2-client-20261023
          fi
