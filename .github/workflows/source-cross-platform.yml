name: LiOS Hosted Source Validation

# Prepared for the owner's deliberate public-source release. While private,
# every job is disabled; do not dispatch this to work around billing/readiness.
# This is source regression evidence, not packaged SP/P14 qualification.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: Run normal source validation or the separate approved donor source build
        required: true
        default: source
        type: choice
        options:
          - source
          - approved-openclaw-build

permissions:
  contents: read

concurrency:
  group: lios-hosted-source-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source_reuse:
    if: github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Main / exact-tree validation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup proof reader Node 22.12.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - name: Verify all three successful PR jobs tested this exact Git tree
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/script/source_validation_reuse.mjs --verify-main

  source:
    needs: source_reuse
    # !cancelled() permits the matrix when the main-only proof job is skipped or fails.
    # PR/manual source checks never reuse. Incomplete main proof also runs all three.
    if: ${{ !cancelled() && github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.task != 'approved-openclaw-build') && needs.source_reuse.outputs.reuse != 'true' }}
    name: Source / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            # Standard hosted Intel capacity; macos-15 arm64 repeatedly failed
            # before runner acquisition. Source checks are not native arm64 release proof.
            runner: macos-15-intel
          - platform: Windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    # Intel macOS exceeded the 60m aggregate deadline after setup, offline contracts and Python completed.
    # Preserve the same gates and per-file hang guard; avoid cancelling the final build for lack of aggregate headroom.
    timeout-minutes: ${{ matrix.platform == 'macOS' && 90 || 60 }}
    defaults:
      run:
        working-directory: src
        shell: bash
    env:
      CI: "true"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PYTHONHASHSEED: "0"
      PYTHONPATH: python-service
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # No production environments, secrets, paid inference or provider setup.
      # These are the actual credential/endpoint keys used by byoaiRouter.ts.
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENAI_API_KEY: ""
      MISTRAL_API_KEY: ""
      GROQ_API_KEY: ""
      TOGETHER_API_KEY: ""
      OPENROUTER_API_KEY: ""
      XAI_API_KEY: ""
      OPENAI_COMPATIBLE_API_KEY: ""
      OPENAI_COMPATIBLE_BASE_URL: ""
      AZURE_OPENAI_API_KEY: ""
      AZURE_OPENAI_ENDPOINT: ""
      AZURE_OPENAI_DEPLOYMENT: ""
      OLLAMA_BASE_URL: ""
      LM_STUDIO_BASE_URL: ""
    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node 22.12.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0

      - name: Record exact checkout tree for successful post-merge reuse
        env:
          LIOS_SOURCE_PLATFORM: ${{ matrix.platform }}
        run: node script/source_validation_reuse.mjs --receipt

      - name: Check public-source tracked files and CI boundaries
        run: node script/check_public_repository_safety.mjs

      - name: Setup Python 3.12
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Bind the supported Python executable
        # sys.executable is a native Windows path on Windows, not an MSYS path.
        # server/pythonService.ts and pythonRuntimeManager.ts use this key.
        run: |
          python -c 'import os, sys; open(os.environ["GITHUB_ENV"], "a", encoding="utf-8").write("PYTHON_EXECUTABLE=" + sys.executable + "\nLIMURIA_DATA_DIR=" + os.path.join(os.environ["RUNNER_TEMP"], "lios-offline-source") + "\n")'

      - name: Refuse native AI CLI execution environments
        run: |
          set -euo pipefail
          # Current-main ACP inventories these names without executing them.
          # Keep source CI independent of native providers and subscription login.
          for cli in codex claude cursor-agent acpx; do
            if command -v "$cli" >/dev/null 2>&1; then
              echo "::error::Native AI CLI present; refusing an inference-capable source test environment."
              exit 1
            fi
          done

      - name: Install Node dependencies including native addons
        timeout-minutes: 15
        # No --ignore-scripts: better-sqlite3 and platform dependencies must work.
        run: npm ci --no-audit --no-fund

      - name: Install deterministic Python test dependencies
        timeout-minutes: 15
        run: python -m pip install -r python-service/requirements.txt pytest==9.1.1

      - name: Typecheck
        run: npm run check

      - name: Offline Node, server, shared, client and script contracts
        if: ${{ !cancelled() }}
        # Intel macOS reached the 45m aggregate offline cutoff; individual files still have the existing 5m hang guard.
        # Other OSes retain their current deadline. No failures/skips are converted to success.
        timeout-minutes: ${{ matrix.platform == 'macOS' && 60 || 30 }}
        run: npm run test:offline

      # Source closure, beta acceptance and website test files are already covered by test:offline.
      # Keep the root-level beta manifest test (outside its roots) and the actual editorial-media audit.
      # No packaging, signing keys, paid runners or release uploads.
      - name: Root beta manifest and editorial media integrity (source only)
        if: ${{ !cancelled() && matrix.platform == 'Linux' }}
        timeout-minutes: 10
        run: |
          npm run beta:manifest:test
          npm run media:verify

      - name: Installed UX evidence negative controls (source only)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        # WS-64 runtime scenarios already run in test:offline. These evals are
        # outside that runner's roots and do not certify native observations.
        run: npm run test:ws65

      - name: Phase 4 source evidence boundaries (never native qualification)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        # Its test:phase4 files already ran in test:offline; retain the distinct evidence report.
        run: npm run phase4:release:report

      - name: OSS donor licence, supply-chain and CI preflight source gates
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          npm run audit:oss
          npm run audit:licenses
          npm run release:preflight:ci

      - name: Desktop source and syntax contracts
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npm run test:desktop

      - name: Deterministic Python engine tests
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        # Pytest collects unittest.TestCase suites and function-style known answers.
        # unittest discovery alone imports but does not run pytest functions.
        run: python -m pytest python-service -v

      - name: Build client, server and desktop restore worker
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npm run build

      - name: Phase 4 built client asset size ceiling (not installed performance)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: npm run phase4:assets

      # No uploads, release assets, signing, deployment or credentialed live tests.
      # A failed install/typecheck/test/build remains a failed platform job.
      # Later steps use !cancelled() so one run reports every failing step; the job still fails if any step fails.

  approved-openclaw-build:
    if: github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.task == 'approved-openclaw-build'
    name: Approved OpenClaw / isolated source build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout unprivileged build command
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup build-command Node 22.12.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
      - name: Build exact approved source with isolated Node 24.16.0
        run: node src/script/build_approved_openclaw_runtime.mjs --build
      # Standard public runner only. No secrets, inference, binary uploads or release publication.
      # Source / Linux, macOS and Windows are untouched on push/PR and do not run for this explicit manual mode.
