# Review-only updates. Do not auto-merge: release rights and the native
# runtime copied dependency graph require separate validation.
version: 2
updates:
  - package-ecosystem: npm
    directory: /src
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /src/python-service
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
