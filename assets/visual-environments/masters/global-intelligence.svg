<svg data-lios-master="true" data-scene-id="global-intelligence" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="LiOS global intelligence visual environment">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="76%">
      <stop offset="0" stop-color="#0A0A0D"/>
      <stop offset=".46" stop-color="#060608"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="0%" cy="45%" r="78%">
      <stop offset="0" stop-color="#F3A21A" stop-opacity=".18"/><stop offset=".58" stop-color="#F3A21A" stop-opacity=".035"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="100%" cy="42%" r="76%">
      <stop offset="0" stop-color="#25A9D6" stop-opacity=".18"/><stop offset=".58" stop-color="#25A9D6" stop-opacity=".035"/><stop offset="1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#F3A21A" stop-opacity=".08"/><stop offset=".48" stop-color="#F3A21A" stop-opacity=".72"/><stop offset="1" stop-color="#F3A21A" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="cool" x1="1" y1="0" x2="0" y2="1">
      <stop stop-color="#25A9D6" stop-opacity=".08"/><stop offset=".5" stop-color="#25A9D6" stop-opacity=".66"/><stop offset="1" stop-color="#25A9D6" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3A21A" stop-opacity=".22"/><stop offset=".52" stop-color="#25A9D6" stop-opacity=".28"/><stop offset="1" stop-color="#F3A21A" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="softArea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F3A21A" stop-opacity=".28"/><stop offset="1" stop-color="#25A9D6" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="76" height="76" patternUnits="userSpaceOnUse">
      <path d="M76 0H0V76" fill="none" stroke="#AAB1C8" stroke-opacity=".055" stroke-width=".8"/>
    </pattern>
    <filter id="blur72"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="blur28"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
    <mask id="edgeMask">
      <rect width="1920" height="1080" fill="white"/>
      <rect x="430" y="120" width="1060" height="820" rx="210" fill="#2A2A2A"/>
    </mask>
    <radialGradient id="centerQuiet" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#050506" stop-opacity=".70"/><stop offset=".62" stop-color="#050506" stop-opacity=".28"/><stop offset="1" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#leftGlow)"/>
  <rect width="1920" height="1080" fill="url(#rightGlow)"/>
  <ellipse cx="222" cy="238" rx="260" ry="220" fill="#F3A21A" fill-opacity=".06" filter="url(#blur72)"/>
  <ellipse cx="1698" cy="760" rx="310" ry="250" fill="#25A9D6" fill-opacity=".055" filter="url(#blur72)"/>
  <g mask="url(#edgeMask)">
