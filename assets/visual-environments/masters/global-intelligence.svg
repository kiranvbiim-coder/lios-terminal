        <path d="M-720 -42 C-465 -150 -230 -122 0 -228 C245 -340 495 -314 735 -410" stroke="url(#cool)" stroke-width="1.5" opacity=".42"/>
      </g>
      <g stroke="url(#cool)" stroke-width="1" opacity=".28">
        <path d="M110 390 Q355 168 624 326 T1110 282 T1780 210" fill="none"/>
        <path d="M64 694 Q330 518 586 608 T1100 528 T1860 470" fill="none"/>
      </g>
      <g fill="#25A9D6" opacity=".72">
        <circle cx="142" cy="404" r="3"/><circle cx="376" cy="258" r="4"/><circle cx="608" cy="326" r="3"/>
        <circle cx="1270" cy="258" r="3"/><circle cx="1545" cy="238" r="4"/><circle cx="1758" cy="212" r="3"/>
      </g>
      <g fill="#F3A21A" opacity=".68">
        <circle cx="264" cy="575" r="3"/><circle cx="501" cy="592" r="4"/><circle cx="1395" cy="514" r="4"/><circle cx="1660" cy="492" r="3"/>
      </g>
    
  </g>
  <path d="M0 974 C310 884 504 948 714 892 C920 836 1120 878 1332 826 C1538 776 1722 802 1920 742" fill="none" stroke="url(#edge)" stroke-width="1" opacity=".18"/>
  <rect x="418" y="108" width="1084" height="844" rx="220" fill="url(#centerQuiet)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".24"/>
